name: Build/release
on:
  push:
    tags:
      # Build on every tag in the form v1.2.3-something.4
      - "v*"
  workflow_dispatch:

defaults:
  run:
    shell: bash # Run everything using bash

jobs:
  build_macos:
    name: macOS build
    runs-on: macos-latest
    outputs:
      version: ${{ steps.ref.outputs.version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      # Angular 11 and Electron 3 need an older Node. Node 14 has no Apple
      # Silicon build, so run the x64 build under Rosetta.
      - name: Setup Node.js 14.x
        uses: actions/setup-node@v4
        with:
          node-version: "14.x"
          architecture: x64
      - name: Retrieve package version
        id: ref
        run: echo "version=$(node ./electron/scripts/get-pkg-version.js)" >> "$GITHUB_OUTPUT"
      # Save the macOS certificate on this runner for electron-builder to use
      # in the build step below.
      - name: Retrieve code signing certificate
        run: sh ./electron/scripts/add-osx-cert.sh
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
      - name: Install dependencies
        run: npm install --unsafe-perm=true --allow-root
      - name: macOS build
        run: npm run build:prod && npx electron-builder build --mac -p never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            ./electron/release/MagicBox-${{ steps.ref.outputs.version }}.dmg
            ./electron/release/MagicBox-${{ steps.ref.outputs.version }}-mac.zip
            ./electron/release/latest-mac.yml

  prepare_release:
    name: Prepare release draft
    # Only tag pushes create a release. Manual runs only build.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release
      - name: Create a new release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build_macos.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Release $VERSION" \
            --notes "If you can read this, I have forgotten to fill in the changelog. Sorry!"
